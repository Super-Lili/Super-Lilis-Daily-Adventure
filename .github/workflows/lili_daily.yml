name: 🌸 Super-Lili Daily Adventure

on:
  schedule:
    # DeepSeek peak pricing (2x): 09:00-12:00 and 14:00-18:00 Beijing (official
    # docs, confirmed 2026-08-18). 2026-08-18: moved all 3 slots out of daytime
    # entirely (owner's call, pricing pressure) - overnight + evening only now,
    # nothing between 06:00-20:00 Beijing.
    - cron: '0 18 * * *'   # 02:00 Beijing (primary) — deep night, off-peak
    - cron: '30 12 * * *'  # 20:30 Beijing (backup) — evening, off-peak
    - cron: '30 15 * * *'  # 23:30 Beijing (backup) — late night, off-peak
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (Mode 3 ground-truth validation)
        run: python -m playwright install --with-deps chromium

      - name: Check
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          DOW=$(TZ='Asia/Shanghai' date +'%u')
          TOOL_EXISTS=$(find 02_Toolbox -maxdepth 2 -name "${DATE}*" -type d | head -1)
          # Throttle workflow_dispatch specifically: each real attempt (success or
          # rest-day) produces one "Daily Adventure" commit for that date. We run 3
          # designed schedule slots per day; on 2026-07-29 an unexplained daily
          # workflow_dispatch from outside this repo was firing a 4th attempt every
          # morning, silently burning an extra SCOUT->SPEC->BUILD API cycle. This
          # only throttles manual/API (workflow_dispatch) triggers once 3+ attempts
          # already happened today - the 3 native `schedule` slots are NEVER
          # throttled, so same-day resilience retries (e.g. after a rest day) keep
          # working exactly as before, and a deliberate manual re-trigger during
          # active debugging still only gets capped after 3 real attempts already ran.
          ATTEMPTS_TODAY=$(git log --oneline --grep="${DATE} Daily Adventure" | wc -l | tr -d ' ')
          echo "date=$DATE" >> $GITHUB_OUTPUT
          if [ "$DOW" = "7" ] || [ -n "$TOOL_EXISTS" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$ATTEMPTS_TODAY" -ge 3 ]; then
            echo "  workflow_dispatch throttled: $ATTEMPTS_TODAY attempts already made today."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run
        if: steps.check.outputs.skip == 'false'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
          # Pin the pipeline's date to the same Beijing date the Check step
          # computed - without this, lili_pipeline.py falls back to
          # datetime.utcnow(), which lands on the previous calendar day for
          # any run inside the UTC 16:00-23:59 window (the primary 23:30 UTC
          # / 07:30 Beijing slot always does). That mismatch has silently
          # misdated 01_Work_Log/*.md and once overwrote a real diary entry
          # (2026-08-09's Weekly Evolution report, clobbered by 2026-08-10's
          # rest-day run). See CLAUDE.md Pitfalls Logged.
          LILI_DATE: ${{ steps.check.outputs.date }}
        run: python src/super_lili_brain.py

      - name: Commit
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "Super-Lili (Bot)"
          git config user.email "lili-bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "✨ ${{ steps.check.outputs.date }} Daily Adventure"
          git pull --rebase -X ours origin main || (git rebase --abort && git pull --no-rebase origin main)
          git push
