name: 🌸 Super-Lili Weekly Evolution

on:
  schedule:
    # DeepSeek peak pricing (2x): 09:00-12:00 and 14:00-18:00 Beijing. All three
    # slots below sit in off-peak windows. Note: 07:05/12:05 Beijing Sunday fall
    # on Saturday/Sunday UTC respectively, so the cron day-of-week differs.
    - cron: '5 23 * * 6'  # 07:05 Beijing Sunday (primary) — off-peak, before 09:00 peak
    - cron: '5 4 * * 0'   # 12:05 Beijing Sunday (backup) — off-peak gap between peaks
    - cron: '5 12 * * 0'  # 20:05 Beijing Sunday (backup) — off-peak
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check
        id: check
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          echo "date=$TODAY" >> $GITHUB_OUTPUT
          if [ -f "03_Evolution_Log/${TODAY}_Weekly_Evolution.md" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run
        if: steps.check.outputs.skip == 'false'
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: src
          # Same fix as lili_daily.yml: pin the pipeline's date to the
          # Beijing date the Check step already used to decide whether to
          # run, so the two can never disagree. Without this, the skip
          # guard (TODAY, Beijing) and the report filename it's guarding
          # (datetime.utcnow() in Python) can be one day apart near the
          # UTC 16:00-23:59 window, so the guard fails to recognize a report
          # already ran and fires a redundant second run - this is the
          # confirmed root cause of the back-to-back 08-08/08-09 duplicate
          # Weekly Evolution runs. See CLAUDE.md Pitfalls Logged.
          LILI_DATE: ${{ steps.check.outputs.date }}
        run: python src/super_lili_weekly_evolution.py

      - name: Commit
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "Super-Lili (Evolution)"
          git config user.email "lili-bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "🌸 ${{ steps.check.outputs.date }} Weekly Evolution"
          git pull --rebase origin main
          git push
